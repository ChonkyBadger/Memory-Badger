    id: CreateCaveManager
    path: Memory/Core/Memory.Caves.cs
    startLine: 28
  assemblies:
  - MemoryBadger
  namespace: MemoryBadger
  summary: >-
    Allocates an executable memory page in the target process near a preferred address,

    managed by a <xref href="MemoryBadger.Caves.CaveManager" data-throw-if-not-resolved="false"></xref> instance to allow the creation of multiple smaller

    caves and hooks in a single memory allocation with ease.
  example: []
  syntax:
    content: public CaveManager CreateCaveManager(nint address, int size = 4096)
    parameters:
    - id: address
      type: System.IntPtr
      description: The preferred baseline address to start searching from.
    - id: size
      type: System.Int32
      description: >-
        The total size of the parent page to allocate. Defaults to 4096 bytes
            which is the size of a single page.
    return:
      type: MemoryBadger.Caves.CaveManager
      description: A managed <xref href="MemoryBadger.Caves.CaveManager" data-throw-if-not-resolved="false"></xref> instance capable of spawning safe sub-allocations.
    content.vb: Public Function CreateCaveManager(address As IntPtr, size As Integer = 4096) As CaveManager
  overload: MemoryBadger.Memory.CreateCaveManager*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: Thrown if Windows fails to allocate memory after searching.
  nameWithType.vb: Memory.CreateCaveManager(IntPtr, Integer)
  fullName.vb: MemoryBadger.Memory.CreateCaveManager(System.IntPtr, Integer)
  name.vb: CreateCaveManager(IntPtr, Integer)
