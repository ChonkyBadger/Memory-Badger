    id: CreateDetour
    path: Memory/Core/Memory.Caves.cs
    startLine: 70
  assemblies:
  - MemoryBadger
  namespace: MemoryBadger
  summary: >-
    Allocates memory for and creates a <xref href="MemoryBadger.Caves.Detour" data-throw-if-not-resolved="false"></xref>. Automatically writes your custom payload

    to the detour using <xref href="MemoryBadger.Caves.Detour.Write(System.IntPtr%2cSystem.Int32%2cSystem.ReadOnlySpan%7bSystem.Byte%7d)" data-throw-if-not-resolved="false"></xref> The <xref href="MemoryBadger.Caves.Detour" data-throw-if-not-resolved="false"></xref> 

    automatically writes JMP instructions to and from the Detour after writing your instructions.
  example: []
  syntax:
    content: public Detour CreateDetour(nint address, int bytesReplaced, ReadOnlySpan<byte> payload, int size = 4096)
    parameters:
    - id: address
      type: System.IntPtr
      description: The preferred baseline address to start searching for free memory from.
    - id: bytesReplaced
      type: System.Int32
      description: >-
        Number of bytes that will be replaced when writing the
            the JMP from the original game code to the detour.
    - id: payload
      type: System.ReadOnlySpan{System.Byte}
      description: >-
        A <xref href="System.ReadOnlySpan%601" data-throw-if-not-resolved="false"></xref> containing custom bytes to automatically write
            in the <xref href="MemoryBadger.Caves.Detour" data-throw-if-not-resolved="false"></xref>
    - id: size
      type: System.Int32
      description: >-
        The total size of the parent page to allocate. Defaults to 4096 bytes
            which is the size of a single page.
    return:
      type: MemoryBadger.Caves.Detour
      description: A managed <xref href="MemoryBadger.Caves.CodeCave" data-throw-if-not-resolved="false"></xref> instance capable of spawning safe sub-allocations.
    content.vb: Public Function CreateDetour(address As IntPtr, bytesReplaced As Integer, payload As ReadOnlySpan(Of Byte), size As Integer = 4096) As Detour
  overload: MemoryBadger.Memory.CreateDetour*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: Thrown if Windows fails to allocate memory after searching.
  nameWithType.vb: Memory.CreateDetour(IntPtr, Integer, ReadOnlySpan(Of Byte), Integer)
  fullName.vb: MemoryBadger.Memory.CreateDetour(System.IntPtr, Integer, System.ReadOnlySpan(Of Byte), Integer)
  name.vb: CreateDetour(IntPtr, Integer, ReadOnlySpan(Of Byte), Integer)
