  assemblies:
  - MemoryBadger
  namespace: MemoryBadger
  summary: >-
    Scans for an array of bytes, returning a list of results. 

    To avoid bad results, try to make the array of bytes as unique as possible.
  example: []
  syntax:
    content: public nint ScanMemory(ReadOnlySpan<byte?> signature, nint startAddress = 0)
    parameters:
    - id: signature
      type: System.ReadOnlySpan{System.Nullable{System.Byte}}
      description: >-
        Bytes to scan for for passed in a <xref href="System.ReadOnlySpan%601" data-throw-if-not-resolved="false"></xref>.
            Null bytes are treated as wildcards. Example: [0x48, 0x8B, null, null, 0x48]
    - id: startAddress
      type: System.IntPtr
      description: Base address of memory module to start scan from.
    return:
      type: System.IntPtr
      description: >-
        List contining address found matching provided byte signature.
            If the scan was good, it is usually the first address.
