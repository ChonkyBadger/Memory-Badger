  assemblies:
  - MemoryBadger
  namespace: MemoryBadger
  summary: >-
    Allocates memory for and creates a <xref href="MemoryBadger.Caves.Detour" data-throw-if-not-resolved="false"></xref>. Use <xref href="MemoryBadger.Caves.Detour.Write(System.IntPtr%2cSystem.Int32%2cSystem.ReadOnlySpan%7bSystem.Byte%7d)" data-throw-if-not-resolved="false"></xref>

    to write custom instructions. The <xref href="MemoryBadger.Caves.Detour" data-throw-if-not-resolved="false"></xref> automatically writes JMP instructions to

    and from the Detour after writing your instructions.
  example: []
  syntax:
    content: public Detour CreateDetour(nint address, int size = 4096)
    parameters:
    - id: address
      type: System.IntPtr
      description: The preferred baseline address to start searching for free memory from.
    - id: size
      type: System.Int32
      description: >-
        The total size of the parent page to allocate. Defaults to 4096 bytes
            which is the size of a single page.
    return:
      type: MemoryBadger.Caves.Detour
      description: A managed <xref href="MemoryBadger.Caves.CodeCave" data-throw-if-not-resolved="false"></xref> instance capable of spawning safe sub-allocations.
